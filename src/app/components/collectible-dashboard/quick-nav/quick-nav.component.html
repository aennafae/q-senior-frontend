<div
  class="quick-nav"
  [class.is-stuck]="isStuck"
  animate.enter="nav-enter">
  <div class="nav-container">
    <div class="nav-intro">
      <span class="intro-label">Page Overview</span>
      <p class="intro-text">Jump to key sections</p>
    </div>

    <div class="nav-links">
      <button
        *ngFor="let link of navLinks"
        class="nav-link"
        (click)="scrollToSection('app-' + link.id)"
        [attr.aria-label]="link.label"
        animate.enter="link-enter">
        <div class="link-icon">
          <mat-icon>{{ link.icon }}</mat-icon>
        </div>
        <div class="link-content">
          <span class="link-label">{{ link.label }}</span>
          <span class="link-desc">{{ link.description }}</span>
        </div>
        <mat-icon class="link-arrow">arrow_forward</mat-icon>
      </button>
    </div>

    <button
      *ngIf="isStuck"
      class="scroll-top-btn"
      (click)="scrollToTop()"
      aria-label="Scroll to top"
      animate.enter="scroll-top-enter">
      <mat-icon>arrow_upward</mat-icon>
    </button>
  </div>
</div>
<div class="quick-nav-spacer" *ngIf="isStuck" [style.height.px]="navHeight"></div>
